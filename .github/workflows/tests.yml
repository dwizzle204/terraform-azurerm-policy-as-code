name: tests

# Credential-free validation (issue #16): static analysis + offline module
# contract tests with mocked providers. No Azure tenant or secrets required.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-analysis:
    name: Static Analysis (no Azure creds)
    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - uses: hashicorp/setup-terraform@633666f66e0061ca3b725c73b2ec20cd13a8fdd1 # v2
        with:
          terraform_version: ~1.15.0
          terraform_wrapper: false

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Install TFLint (pinned)
        uses: terraform-linters/setup-tflint@19a52fbac37dacb22a09518e4ef6ee234f2d4987 # v4.0.0
        with:
          tflint_version: v0.64.0

      - name: TFLint
        env:
          # authenticated GitHub API requests avoid runner-IP rate limits during plugin init
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tflint --version
          tflint --init --recursive
          tflint --recursive

      - name: Sequencing Guard (all 4 remediation resources depend on AAD group and RBAC)
        run: |
          for mod in def_assignment set_assignment; do
            (cd "modules/$mod" && terraform init -backend=false -no-color >/dev/null)
            graph_file=$(mktemp)
            if ! (cd "modules/$mod" && terraform graph -type=plan -no-color >"$graph_file" 2>/dev/null); then
              echo "sequencing check failed for $mod: terraform graph failed"
              exit 1
            fi
            for remediation in management_group subscription resource_group resource; do
              if ! grep -Fq "[root] azurerm_${remediation}_policy_remediation.rem (expand)\" -> \"[root] azuread_group_member.remediation (expand)" "$graph_file"; then
                echo "sequencing check failed for $mod: missing ${remediation} AAD group dependency"
                exit 1
              fi
              if ! grep -Fq "[root] azurerm_${remediation}_policy_remediation.rem (expand)\" -> \"[root] azurerm_role_assignment.remediation (expand)" "$graph_file"; then
                echo "sequencing check failed for $mod: missing ${remediation} RBAC dependency"
                exit 1
              fi
            done
          done
          echo "OK: all remediation resources depend on both azuread_group_member and azurerm_role_assignment"

  examples-validate:
    name: Examples Validate (backend disabled, no Azure creds)
    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - uses: hashicorp/setup-terraform@633666f66e0061ca3b725c73b2ec20cd13a8fdd1 # v2
        with:
          terraform_version: ~1.15.0
          terraform_wrapper: false

      - name: Terraform Init (backend disabled)
        run: terraform init -backend=false -no-color

      - name: Terraform Validate
        run: terraform validate -no-color

  examples-intent-validate:
    name: Examples Intent Validate (backend disabled, no Azure creds)
    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples-intent
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - uses: hashicorp/setup-terraform@633666f66e0061ca3b725c73b2ec20cd13a8fdd1 # v2
        with:
          terraform_version: ~1.15.0
          terraform_wrapper: false

      - name: Terraform Init (backend disabled)
        run: terraform init -backend=false -no-color

      - name: Terraform Validate
        run: terraform validate -no-color

  examples-machine-config-validate:
    name: Examples Machine Config Validate (backend disabled, no Azure creds)
    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples-machine-config
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - uses: hashicorp/setup-terraform@633666f66e0061ca3b725c73b2ec20cd13a8fdd1 # v2
        with:
          terraform_version: ~1.15.0
          terraform_wrapper: false

      - name: Terraform Init (backend disabled)
        run: terraform init -backend=false -no-color

      - name: Terraform Validate
        run: terraform validate -no-color

  offline-module-tests:
    name: Module Tests (${{ matrix.module }}, tf ${{ matrix.terraform_version }}) — mocked providers, no Azure creds
    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [definition, initiative, exemption, def_assignment, set_assignment, intent]
        terraform_version: ["~1.11.0", "~1.15.0"]
    defaults:
      run:
        working-directory: modules/${{ matrix.module }}
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - uses: hashicorp/setup-terraform@633666f66e0061ca3b725c73b2ec20cd13a8fdd1 # v2
        with:
          terraform_version: ${{ matrix.terraform_version }}
          terraform_wrapper: false

      - name: Terraform Init (backend disabled)
        run: terraform init -backend=false -no-color

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Test (mocked)
        run: terraform test -no-color

  provider-compatibility:
    name: Provider Compatibility (minimum floors azurerm 4.35 / azuread 2.47)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - uses: hashicorp/setup-terraform@633666f66e0061ca3b725c73b2ec20cd13a8fdd1 # v2
        with:
          terraform_version: ~1.15.0
          terraform_wrapper: false
      - name: Validate minimum provider floors
        run: |
          for mod in modules/definition modules/initiative modules/exemption modules/def_assignment modules/set_assignment modules/intent; do
            echo "=== $mod at azurerm=4.35.0 azuread=2.47.0 ==="
            cp "$mod/versions.tf" "$mod/versions.tf.bak"
            # pin to minimum versions for this check
            sed -i 's/version = ">= 4.35, < 6.0"/version = "= 4.35.0"/' "$mod/versions.tf" 2>/dev/null || true
            sed -i 's/version = ">= 2.0, < 4.0"/version = "= 2.47.0"/' "$mod/versions.tf" 2>/dev/null || true
            sed -i 's/version = ">= 3.1, < 4.0"/version = "= 3.6.0"/' "$mod/versions.tf" 2>/dev/null || true
            # assert the pin actually landed (fail loudly if the sed missed)
            grep -q 'azurerm' "$mod/versions.tf" && grep -q '= 4.35.0' "$mod/versions.tf" || { echo "azurerm floor pin did not land in $mod"; exit 1; }
            (cd "$mod" && terraform init -backend=false -upgrade -no-color && terraform validate -no-color)
            mv "$mod/versions.tf.bak" "$mod/versions.tf"
            (cd "$mod" && terraform init -backend=false -upgrade -no-color >/dev/null)
          done
          echo "minimum floors validated"

      - name: Terraform Test at minimum floors (assignment + initiative)
        run: |
          for mod in modules/initiative modules/set_assignment; do
            cp "$mod/versions.tf" "$mod/versions.tf.bak"
            sed -i 's/version = ">= 4.35, < 6.0"/version = "= 4.35.0"/' "$mod/versions.tf" 2>/dev/null || true
            sed -i 's/version = ">= 2.0, < 4.0"/version = "= 2.47.0"/' "$mod/versions.tf" 2>/dev/null || true
            grep -q '= 4.35.0' "$mod/versions.tf" || { echo "floor pin did not land in $mod"; exit 1; }
            (cd "$mod" && terraform init -backend=false -upgrade -no-color >/dev/null && terraform test -no-color)
            mv "$mod/versions.tf.bak" "$mod/versions.tf"
            (cd "$mod" && terraform init -backend=false -upgrade -no-color >/dev/null)
          done
          echo "minimum-floor module tests passed"
