name: tests

# Credential-free validation (issue #16): static analysis + offline module
# contract tests with mocked providers. No Azure tenant or secrets required.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-analysis:
    name: Static Analysis (no Azure creds)
    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ~1.15.0
          terraform_wrapper: false

      - name: Terraform Format
        run: terraform fmt -check -recursive

  examples-validate:
    name: Examples Validate (backend disabled, no Azure creds)
    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@v3

      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ~1.15.0
          terraform_wrapper: false

      - name: Terraform Init (backend disabled)
        run: terraform init -backend=false -no-color

      - name: Terraform Validate
        run: terraform validate -no-color

  offline-module-tests:
    name: Module Tests (${{ matrix.module }}) — mocked providers, no Azure creds
    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [definition, initiative, exemption, def_assignment, set_assignment]
    defaults:
      run:
        working-directory: modules/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v3

      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ~1.15.0
          terraform_wrapper: false

      - name: Terraform Init (backend disabled)
        run: terraform init -backend=false -no-color

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Test (mocked)
        run: terraform test -no-color
